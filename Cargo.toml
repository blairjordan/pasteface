[package]
name = "pasteface"
version = "0.1.0"
edition = "2024"
description = "A quiet place to think out loud. Local transcription in your terminal."
license = "MIT"
repository = "https://github.com/blairjordan/pasteface"

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:gtk", "dep:tao"]

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
crossterm = "0.29"
dirs = "6"
fs2 = "0.4"
hound = "3.5"
libc = "0.2"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tray-icon = { version = "0.21", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.37", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
